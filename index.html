<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sell digital products from your own store — Shopify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" href="assets/hero-still.png" as="image" />
  </head>
  <body>
    <header class="header" aria-label="Primary">
      <nav class="nav-main" aria-label="Main">
        <a class="logo" href="#" aria-label="Shopify home">
          <span class="logo-word">shopify</span>
        </a>

        <button class="nav-link nav-link--toggle" type="button">
          Why Shopify
          <svg class="chevron" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="nav-link nav-link--toggle" type="button">
          Products
          <svg class="chevron" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <a class="nav-link" href="#">Pricing</a>
        <a class="nav-link" href="#">Enterprise</a>
      </nav>

      <div class="nav-secondary">
        <a class="nav-link nav-link--light" href="#">Log in</a>
        <a class="btn btn--sm btn--primary" href="#">Start for free</a>
      </div>
    </header>

    <main class="hero">
      <div class="hero-container">
        <div class="hero-text">
          <h1 class="display">Sell digital products from your own store</h1>
          <p class="lede">PDFs, templates, MP3s, or videos&mdash;monetize any file on the platform built for digital, physical, and global selling.</p>
          <div class="hero-cta">
            <a class="btn btn--lg btn--primary" href="#">Start for free</a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <img src="assets/hero-still.png" alt="" loading="eager" decoding="async" />
        </div>
      </div>
    </main>
  </body>
</html>
